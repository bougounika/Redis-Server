events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream redis_ui {
        server redis-insight:5540;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. Root Fallback
        location / {
            return 200 'Root path successfully reserved! Your upcoming application is currently offline.';
            add_header Content-Type text/plain;
        }

        # 2. Redis Dashboard Panel Path
        location /redis_ui {
            proxy_pass http://redis_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Fixed the typo here: changed hyphen to underscore (_for)
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket upgrade parameters for streaming panel diagnostics
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }
    }
}
