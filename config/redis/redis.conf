################################## NETWORKING #################################
# Allow connections from any network interface inside the container. 
# Security is handled by the isolated Docker network and mandatory passwords.
bind 0.0.0.0
port 6379

# Close the connection after a client is idle for N seconds (0 to keep it open)
timeout 0
tcp-keepalive 300

################################### SECURITY ##################################
# Require clients to issue AUTH <password> before processing any other commands.
# (Note: In your compose setup, this gets reinforced dynamically via the .env variable)
protected-mode yes

# Rename or disable dangerous commands to prevent accidental database destruction
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""

################################# PERSISTENCE #################################
# 1. RDB (Snapshots) Configuration
# Save snapshots to disk if conditions are met:
# After 900 sec (15 min) if at least 1 key changed
# After 300 sec (5 min) if at least 10 keys changed
# After 60 sec if at least 10000 keys changed
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
dbfilename dump.rdb
dir /data

# 2. AOF (Append Only File) Configuration
# Highly recommended for preventing data loss. Logs every write operation.
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"

# Sync to disk every single second (Excellent balance between safety and speed)
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes

############################### MEMORY MANAGEMENT #############################
# Set a memory limit to protect your system from running out of RAM.
# If this limit is reached, Redis evicts keys using the Least Recently Used (LRU) policy.
maxmemory 256mb
maxmemory-policy allkeys-lru

################################### LOGGING ###################################
loglevel notice
logfile ""

################################ ADVANCED TUNING ##############################
# Optimization settings for performance and stability inside virtual environments
databases 16
always-show-logo no
slowlog-log-slower-than 10000
slowlog-max-len 128

latency-monitor-threshold 0
notify-keyspace-events ""

# Advanced micro-tuning for internal memory efficiency
hash-max-listpack-entries 512
hash-max-listpack-value 64
list-max-listpack-size -2
set-max-intset-entries 512
zset-max-listpack-entries 128
zset-max-listpack-value 64

activerehashing yes
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes
