services:
  redis-backup:
    image: alpine:latest
    container_name: redis_backup
    hostname: ${REDIS_BACKUP_HOST}
    user: root 
    volumes:
      - redis_data:/data:ro
      - ../backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Starting modular snapshot backup loop..."
        echo "0 2 * * * cp /data/appendonly.aof /backups/appendonly.aof.\$(date +\\%F_\\%H\\%M\\%S) 2>/dev/null || cp /data/dump.rdb /backups/dump.rdb.\$(date +\\%F_\\%H\\%M\\%S)" > /etc/periodic/daily/redis-backup
        chmod +x /etc/periodic/daily/redis-backup
        crond -f -l 2
    networks:
      - backend_isolated_redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always



