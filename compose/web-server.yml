services:
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    hostname: ${NGINX_HOST:-nginx-proxy}
    ports:
      - "${HTTP_PORT:-8500}:80"
    volumes:
      - ../config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend_proxy_redis
    depends_on:
      redis-insight:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
